<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>10BR Week 7 Live Lesson</title>
<meta name="description" content="Timed 40-minute interactive lesson screens for Grade 10BR, IGCSE 0478 Week 7.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: projector console. Timer bar on top, coloured stage strip, one big stage screen, controls at the bottom.
   One deliberate light look (projectors wash out dark slides), each lesson stage owns a colour. */
:root{
  color-scheme:light;
  --paper:#f6f7fc; --card:#ffffff; --ink:#1b1d3a; --muted:#565b7c; --line:#d9dcec;
  --alert:#d8322a; --good:#11845f; --bad:#c2352b;
  --c:#8fd3ff; --cd:#0b6aa8;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-code:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --base:clamp(15px,0.9vw + 8px,25px);
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:var(--base);line-height:1.45;margin:0}
*{box-sizing:border-box}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--cd);outline-offset:2px}

.app{height:100%;display:grid;grid-template-rows:auto auto 1fr auto;padding-inline:16px;gap:10px;padding-block:10px}

/* ---- top bar ---- */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;justify-content:space-between}
.brand{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;min-width:0}
.brand b{font-family:var(--f-display);font-weight:800;font-size:1.1em;letter-spacing:-.01em}
.brand .sub{color:var(--muted);font-size:.8em}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:.2em .8em;font-weight:700;font-size:.8em}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
select{border:2px solid var(--ink);border-radius:999px;background:var(--card);padding:.15em .6em;font-weight:700;font-size:.8em}
.clocks{display:flex;align-items:stretch;gap:10px;flex-wrap:wrap}
.clock{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:.25em .8em;display:flex;flex-direction:column;justify-content:center;min-width:0}
.clock .lab{font-size:.62em;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.clock .num{font-family:var(--f-code);font-weight:700;font-variant-numeric:tabular-nums;line-height:1.05}
.clock.stage{border-color:var(--cd);background:var(--c)}
.clock.stage .lab{color:var(--ink)}
.clock.stage .num{font-size:2.6em}
.clock.lesson .num{font-size:1.6em}
.clock .pace{font-size:.66em;font-weight:700;color:var(--muted)}
.clock.over{background:var(--alert);border-color:var(--alert);color:#fff;animation:pulse 1s ease-in-out infinite}
.clock.over .lab{color:#fff}
@keyframes pulse{50%{transform:scale(1.04)}}
.play{border:0;border-radius:14px;background:var(--ink);color:var(--paper);font-weight:800;padding:0 1.1em;font-size:1em;min-height:2.6em}
.play.running{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}

/* ---- stage strip ---- */
.strip{display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin}
.strip button{position:relative;flex:var(--grow) 1 0;min-width:4.5em;border:2px solid transparent;border-radius:10px;background:color-mix(in srgb,var(--sc) 35%,var(--card));padding:.3em .5em;text-align:left;overflow:hidden;font-size:.7em;line-height:1.2}
.strip button .t{font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative}
.strip button .m{color:var(--muted);position:relative;font-variant-numeric:tabular-nums}
.strip button .fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--sc);transition:width .4s linear}
.strip button.done .fill{width:100%}
.strip button[aria-current="step"]{border-color:var(--ink)}

/* ---- stage screen ---- */
.screen{position:relative;min-height:0;overflow:hidden;border-radius:22px;background:var(--card);border:2px solid var(--line)}
.slide{position:absolute;inset:0;overflow:auto;display:flex;flex-direction:column}
.slide.in-next{animation:inNext .45s cubic-bezier(.2,.8,.2,1)}
.slide.in-prev{animation:inPrev .45s cubic-bezier(.2,.8,.2,1)}
@keyframes inNext{from{transform:translateX(6%);opacity:.2}}
@keyframes inPrev{from{transform:translateX(-6%);opacity:.2}}
@media (prefers-reduced-motion:reduce){.slide.in-next,.slide.in-prev,.clock.over{animation:none}.strip button .fill{transition:none}}
.band{background:var(--c);padding:clamp(14px,2vw,30px) clamp(16px,3vw,44px);display:flex;flex-wrap:wrap;gap:8px 24px;align-items:flex-end;justify-content:space-between}
.band .eyebrow{font-size:.72em;text-transform:uppercase;letter-spacing:.1em;font-weight:700}
.band h2{font-family:var(--f-display);font-weight:800;font-size:clamp(1.7em,3.4vw,3.1em);line-height:1.02;margin:.1em 0 0;letter-spacing:-.02em;text-wrap:balance}
.band .who{font-size:.8em;font-weight:700;background:var(--card);border-radius:999px;padding:.25em .8em}
.body{padding:clamp(14px,2vw,30px) clamp(16px,3vw,44px);display:grid;gap:clamp(14px,1.6vw,26px);align-content:start;flex:1}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,17em),1fr));gap:clamp(14px,1.6vw,26px);align-items:start}
.cols>*{min-width:0}
.lead{font-size:1.2em;max-width:44em;margin:0;text-wrap:pretty}
h3{font-family:var(--f-display);font-weight:800;font-size:1.15em;margin:0 0 .35em;color:var(--cd)}
ul.plain{margin:0;padding-left:1.1em;display:grid;gap:.3em}
p{margin:0}
.panel{border:2px solid var(--line);border-radius:16px;padding:.8em 1em}
.panel.tint{background:color-mix(in srgb,var(--c) 22%,var(--card));border-color:color-mix(in srgb,var(--c) 60%,var(--card))}

pre.code{font-family:var(--f-code);font-size:1.05em;background:#1f2245;color:#f1f0ff;border-radius:14px;padding:.8em 1em;margin:0;overflow-x:auto;line-height:1.55}
pre.code .k{color:#ffcf6b}
pre.code .s{color:#8fe8c9}
pre.code .c{color:#a6a9d6}
pre.code .e{color:#ff9d93}
.codehead{font-size:.7em;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:.3em}
code{font-family:var(--f-code);font-size:.92em;background:color-mix(in srgb,var(--c) 30%,var(--card));padding:0 .25em;border-radius:5px}

/* phases (think / pair / share ...) */
.phases{display:flex;gap:6px;flex-wrap:wrap}
.phase{border:2px solid var(--cd);border-radius:999px;padding:.25em .9em;font-weight:700;font-size:.85em;color:var(--cd);background:var(--card);font-variant-numeric:tabular-nums}
.phase.now{background:var(--cd);color:#fff}
.phase.past{opacity:.45;text-decoration:line-through}

/* reveal */
.reveal{border:2px dashed var(--cd);background:transparent;border-radius:12px;padding:.35em .9em;font-weight:700;color:var(--cd)}
.ans{background:color-mix(in srgb,var(--c) 30%,var(--card));border-radius:12px;padding:.5em .8em;font-weight:700}
.q{display:grid;gap:.45em;justify-items:start}

/* key words */
.terms{display:flex;flex-wrap:wrap;gap:8px}
.term{border-radius:12px;background:color-mix(in srgb,var(--c) 28%,var(--card));padding:.35em .8em;display:flex;flex-direction:column}
.term b{font-size:1em}
.term span{font-size:.78em;color:var(--muted)}
.term [lang="ar"]{font-size:.9em;color:var(--ink)}

/* tick lists */
.ticks{list-style:none;margin:0;padding:0;display:grid;gap:.4em}
.ticks button{display:flex;gap:.6em;align-items:flex-start;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:.45em .7em;width:100%}
.ticks button::before{content:"";flex:0 0 1.1em;height:1.1em;border:2px solid var(--cd);border-radius:6px;margin-top:.15em}
.ticks button[aria-pressed="true"]{border-color:var(--cd);background:color-mix(in srgb,var(--c) 25%,var(--card))}
.ticks button[aria-pressed="true"]::before{background:var(--cd);box-shadow:inset 0 0 0 3px var(--card)}

/* flip / quiz cards */
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,10.5em),1fr));gap:10px}
.qcard{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:.6em .7em;text-align:left;display:flex;flex-direction:column;gap:.25em;min-height:5.2em}
.qcard .face{font-weight:700;font-size:1.05em}
.qcard .face.mono{font-family:var(--f-code)}
.qcard .back{font-size:.82em}
.qcard.is-good{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--card))}
.qcard.is-bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--card))}
.qcard .verdict{font-weight:800;text-transform:uppercase;font-size:.75em;letter-spacing:.06em}
.is-good .verdict{color:var(--good)}
.is-bad .verdict{color:var(--bad)}

/* card sort */
.types{display:flex;flex-wrap:wrap;gap:6px}
.type-tag{border-radius:999px;padding:.15em .7em;font-family:var(--f-code);font-weight:700;font-size:.8em;color:#fff}
.t-INTEGER{background:#2958c9}.t-REAL{background:#0e8a6a}.t-CHAR{background:#b4560a}.t-STRING{background:#8b2fb8}.t-BOOLEAN{background:#c22d5d}
.sort{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,10em),1fr));gap:8px}
.sc{border:2px solid var(--line);border-radius:12px;background:var(--card);padding:.4em .6em;text-align:left;display:flex;flex-direction:column;gap:.2em}
.sc .ex{font-size:.75em;color:var(--muted);font-family:var(--f-code)}
.sc .pick{align-self:flex-start}
.sc .pick:empty::before{content:"tap to choose";font-family:var(--f-body);font-weight:400;font-size:.75em;color:var(--muted)}
.sc.right{border-color:var(--good);box-shadow:inset 0 0 0 2px var(--good)}
.sc.wrong{border-color:var(--bad);box-shadow:inset 0 0 0 2px var(--bad)}
.sc .fix{font-size:.72em;font-weight:700;color:var(--bad)}

/* table */
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:30em}
th,td{border-bottom:2px solid var(--line);padding:.45em .6em;text-align:left;vertical-align:top}
th{font-size:.72em;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
td code{white-space:nowrap}

/* score / votes */
.score{display:flex;flex-wrap:wrap;gap:10px}
.team{display:flex;align-items:center;gap:.5em;border:2px solid var(--cd);border-radius:14px;padding:.3em .6em;background:var(--card)}
.team b{min-width:5.5em}
.team .n{font-family:var(--f-code);font-size:1.6em;font-weight:700;min-width:1.6em;text-align:center;font-variant-numeric:tabular-nums}
.team button{border:2px solid var(--ink);background:var(--card);border-radius:10px;width:1.9em;height:1.9em;font-weight:800;line-height:1}

.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:2px solid var(--ink);background:var(--card);border-radius:12px;padding:.3em .9em;font-weight:700}
.btn.solid{background:var(--ink);color:var(--paper)}
.note{font-size:.82em;color:var(--muted)}
.big{font-family:var(--f-display);font-weight:800;font-size:1.6em;line-height:1.1;text-wrap:balance;margin:0}

/* contact hook */
.contact{display:grid;gap:.5em;max-width:22em}
.contact .f{display:flex;justify-content:space-between;gap:1em;border-bottom:2px solid var(--line);padding-bottom:.35em}
.contact .tag{font-size:.75em;font-weight:800;text-transform:uppercase;letter-spacing:.06em}

/* form hook */
.form{display:grid;gap:8px;max-width:30em}
.ff{display:grid;grid-template-columns:minmax(0,8em) minmax(0,1fr) auto;gap:.6em;align-items:center;border:2px solid var(--line);border-radius:12px;padding:.4em .7em;background:var(--card);text-align:left}
.ff .v{font-family:var(--f-code)}

/* ---- bottom controls ---- */
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.controls .grp{display:flex;flex-wrap:wrap;gap:8px}
.nav{border:0;background:var(--ink);color:var(--paper);border-radius:12px;padding:.4em 1.1em;font-weight:800}
.nav:disabled{opacity:.3;cursor:default}
.ghost{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:.3em .8em;font-weight:700;font-size:.85em}
.ghost[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.keys{font-size:.65em;color:var(--muted)}

/* ---- teacher notes ---- */
.notes{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(26em,calc(100vw - 20px));background:var(--ink);color:var(--paper);border-radius:18px;padding:1em 1.1em;overflow:auto;z-index:5;font-size:.8em;display:grid;gap:.8em;align-content:start;box-shadow:0 20px 50px rgba(20,22,60,.35)}
.notes h4{margin:0;font-family:var(--f-display);font-size:1.2em}
.notes .k{font-size:.72em;text-transform:uppercase;letter-spacing:.09em;opacity:.7;font-weight:700}
.notes .close{justify-self:end;border:2px solid var(--paper);background:transparent;color:var(--paper);border-radius:10px;padding:.15em .7em;font-weight:700}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--alert);color:#fff;font-weight:800;padding:.6em 1.2em;border-radius:14px;z-index:6;font-size:1.05em;max-width:calc(100vw - 32px);text-align:center}

@media (max-width:700px){
  .app{height:auto;min-height:100%}
  .screen{min-height:70vh}
  .slide{position:relative;inset:auto}
  .keys{display:none}
}
</style>
</head>
<body>

<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <b>G10BR · Week 7</b>
      <span class="sub">IGCSE 0478 · Mr. Ashraf Elbialy</span>
      <div class="seg" role="group" aria-label="Lesson">
        <button type="button" id="pP1" data-period="p1">P1 Variables</button>
        <button type="button" id="pP2" data-period="p2">P2 Data types</button>
      </div>
      <label class="sub" for="cls">Class</label>
      <select id="cls"><option>10BR1</option><option>10BR2</option><option>10BR3</option></select>
    </div>
    <div class="clocks">
      <div class="clock stage" id="stageClock"><span class="lab" id="stageLab">This part</span><span class="num" id="stageNum">0:00</span></div>
      <div class="clock lesson"><span class="lab">Lesson left</span><span class="num" id="lessonNum">40:00</span><span class="pace" id="pace">Ready</span></div>
      <button type="button" class="play" id="play" aria-label="Start timer">▶ Start</button>
    </div>
  </header>

  <nav class="strip" id="strip" aria-label="Lesson stages"></nav>

  <main class="screen" id="screen" aria-live="polite"></main>

  <footer class="controls">
    <div class="grp">
      <button type="button" class="nav" id="prev">◀ Back</button>
      <button type="button" class="nav" id="next">Next ▶</button>
    </div>
    <div class="grp">
      <button type="button" class="ghost" id="plus">+1 min</button>
      <button type="button" class="ghost" id="resetStage">Restart part</button>
      <button type="button" class="ghost" id="notesBtn" aria-pressed="false">Teacher notes</button>
      <button type="button" class="ghost" id="soundBtn" aria-pressed="false">Chime off</button>
      <button type="button" class="ghost" id="fsBtn">Full screen</button>
      <button type="button" class="ghost" id="resetAll">New class</button>
    </div>
  </footer>
</div>

<aside class="notes" id="notes" hidden aria-label="Teacher notes"></aside>
<div class="toast" id="toast" hidden></div>

<script>
const COL = {
  outcomes:["#8fd3ff","#0b5f96"], warm:["#ffc95c","#8a5000"], hook:["#ff9f8f","#a8341f"],
  main:["#78e2c8","#0a6f59"], game:["#c9adff","#5630ad"], debate:["#ff9fd0","#9c1f62"], close:["#cdeb73","#4a6400"]
};
const T = s => `<span class="type-tag t-${s}">${s}</span>`;
const rv = (label, answer) => `<div class="q"><button type="button" class="reveal" data-reveal>${label}</button><div class="ans" hidden>${answer}</div></div>`;

const LESSONS = {
p1:{
  title:"Variables and constants", ref:"Syllabus 0478 8.1.1 · AO1, AO2 · Lesson 1 of 2",
  follow:{ "10BR2":"Check Thonny is installed before class: 3 PCs were missing it last time.",
           "10BR3":"4 students still mix up assignment and equality. Recent arrivals need the bilingual key-term card again." },
  stages:[
  {k:"outcomes",min:2,label:"Outcomes",eyebrow:"Today's goal",title:"Variables and constants",
   html:`<div class="cols">
     <div><h3>By the end of this lesson you will</h3><ul class="plain">
       <li>declare and use <b>variables</b> and <b>constants</b></li>
       <li>choose meaningful <b>identifiers</b> (names)</li>
       <li>turn Cambridge pseudocode into your first Python program and run it</li></ul></div>
     <div><h3>Success criteria</h3><ul class="ticks">
       <li><button type="button" aria-pressed="false">I can explain variable vs constant.</button></li>
       <li><button type="button" aria-pressed="false">I can write <code>DECLARE</code> and <code>CONSTANT</code> statements in pseudocode.</button></li>
       <li><button type="button" aria-pressed="false">I can translate them into Python and run the program without errors.</button></li></ul></div></div>
     <div><h3>Key words</h3><div class="terms">
       <div class="term"><b>variable</b><span lang="ar">متغير</span><span>named memory location that can change</span></div>
       <div class="term"><b>constant</b><span lang="ar">ثابت</span><span>stays fixed while the program runs</span></div>
       <div class="term"><b>identifier</b><span lang="ar">مُعرِّف</span><span>the name you give it</span></div>
       <div class="term"><b>assignment</b><span lang="ar">إسناد</span><span>storing a value: <code>←</code></span></div>
       <div class="term"><b>declare</b><span lang="ar">تصريح</span><span>say its name and type first</span></div></div></div>`,
   notes:{"Starting point":"Ch 7 review test: trace tables strong; about 35% weak at stating an algorithm's purpose. Link algorithms to real code today."}},
  {k:"warm",min:6,label:"Warm-up",eyebrow:"Warm-up · Think, pair, share",title:"What does this program output?",
   phases:[["Think alone",2],["Pair",2],["Share",2]],
   html:`<div class="cols">
     <div><div class="codehead">Pseudocode</div><pre class="code">Score <span class="k">←</span> 5
Score <span class="k">←</span> Score + 2
<span class="k">OUTPUT</span> Score</pre></div>
     <div class="q"><p class="lead">Write your prediction on your mini-whiteboard. Compare with your partner. Hold it up on <b>3, 2, 1</b>.</p>
       ${rv("Reveal the output","<span class='big'>7</span><br>Line 2 takes the old value 5, adds 2 and stores 7 back in Score.")}</div></div>
     <div class="panel tint q"><p class="lead">Now add <code>CONSTANT HourlyRate ← 50</code>. Could a later line say <code>HourlyRate ← 60</code>? Why did Score change but HourlyRate cannot?</p>
       ${rv("Reveal","No. A constant is fixed while the program runs. Score is a variable, so it can be given a new value.")}</div>`,
   notes:{"Evidence":"Mini-whiteboards. Scan for answers of 5 or 52.","Support":"Key-term card with the 'labelled boxes' picture for variables.","Stretch":"Explain why constants make code easier to update."}},
  {k:"hook",min:5,label:"Model it",eyebrow:"Hook and teacher model",title:"Your phone's contact list",
   html:`<div class="cols">
     <div class="panel"><h3>Ahmed's contact card</h3><div class="contact">
       <div class="f"><span>Name: <b>Ahmed</b></span><span class="tag" style="color:var(--good)">stays the same</span></div>
       <div class="f"><span>Number: <b>050 123 4567</b></span><span class="tag" style="color:var(--bad)">may change</span></div></div>
       <p class="note" style="margin-top:.6em">A program stores values the same way: some stay fixed, some change.</p></div>
     <div><h3>Same idea, two languages</h3><div class="cols" style="gap:10px">
       <div><div class="codehead">Cambridge pseudocode</div><pre class="code"><span class="k">DECLARE</span> Price : <span class="k">REAL</span>
<span class="k">CONSTANT</span> VAT_RATE <span class="k">←</span> 0.15</pre></div>
       <div><div class="codehead">Python</div><pre class="code">price = 2.50
VAT_RATE = 0.15</pre></div></div></div></div>
     <div class="cols">
       <div class="panel tint"><h3>← and = both mean "store"</h3><p>In pseudocode <code>←</code> stores a value. In Python a single <code>=</code> stores a value. Neither one means "is equal to".</p></div>
       <div class="panel tint"><h3>Good identifiers</h3><p>No spaces, do not start with a digit, say what is stored: <code>TotalCost</code>, <code>VAT_RATE</code>. In Python, capitals are a promise never to change a constant.</p></div></div>`,
   notes:{"Model":"Think aloud while choosing identifiers. Open Thonny: run, read the error message, fix it.","Watch for":"'A constant is just a variable in capitals.' Ask: what stops it changing?"}},
  {k:"main",min:15,label:"Code it",eyebrow:"Worked example · Code in Thonny",title:"School canteen order",
   phases:[["Plan in pseudocode",4],["Code in Thonny",8],["Run, fix, share",3]],
   html:`<div class="cols">

/* ---------- state ---------- */
const $ = id => document.getElementById(id);
const store = { get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}} };
let period = store.get("br7.period") === "p2" ? "p2" : "p1";
let idx = 0, running = false, last = 0, soundOn = false, audio = null, wake = null;
let elapsed = {p1:[], p2:[]};      // seconds spent per stage
let alerted = {p1:[], p2:[]};
const L = () => LESSONS[period];
const TOTAL = 40 * 60;

const cls = $("cls");
const savedCls = store.get("br7.class"); if (savedCls) cls.value = savedCls;

function fmt(s){ const neg = s < 0; s = Math.abs(Math.round(s)); return (neg ? "+" : "") + Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); }
function setColors(){ const [c,cd] = COL[L().stages[idx].k]; document.documentElement.style.setProperty("--c",c); document.documentElement.style.setProperty("--cd",cd); }

/* ---------- render ---------- */
function renderStrip(){
  $("strip").innerHTML = L().stages.map((s,i)=>`<button type="button" style="--grow:${s.min};--sc:${COL[s.k][0]}" data-go="${i}"><span class="fill"></span><span class="t">${s.label}</span><span class="m">${s.min} min</span></button>`).join("");
}
function renderSlide(dir){
  const s = L().stages[idx];
  setColors();
  const el = document.createElement("section");
  el.className = "slide" + (dir ? (dir > 0 ? " in-next" : " in-prev") : "");
  el.innerHTML = `<div class="band"><div><div class="eyebrow">${s.eyebrow} · ${s.min} min</div><h2>${s.title}</h2></div><span class="who">${L().title} · ${cls.value}</span></div>
    <div class="body">${s.phases ? `<div class="phases">${s.phases.map(p=>`<span class="phase">${p[0]} · ${p[1]}′</span>`).join("")}</div>` : ""}${s.html}</div>`;
  $("screen").replaceChildren(el);
  wire(el);
  renderNotes();
  tick(true);
}
function renderNotes(){
  const s = L().stages[idx], f = L().follow[cls.value];
  $("notes").innerHTML = `<button type="button" class="close" data-closenotes>Close</button><h4>${s.label} · ${s.min} min</h4><div class="note" style="color:inherit;opacity:.8">${L().ref}</div>`
    + `<div><div class="k">Keys</div>← → move · Space start/pause · N notes · F full screen</div>`
    + Object.entries(s.notes||{}).map(([k,v])=>`<div><div class="k">${k}</div>${v}</div>`).join("")
    + (f ? `<div><div class="k">${cls.value} follow-up</div>${f}</div>` : "");
}

/* ---------- interactive widgets ---------- */
const SORT_TYPES = ["INTEGER","REAL","CHAR","STRING","BOOLEAN"];
function wire(root){
  root.querySelectorAll("[data-reveal]").forEach(b=>b.onclick=()=>{ const a=b.nextElementSibling; a.hidden=!a.hidden; b.textContent = a.hidden ? b.dataset.l || b.textContent : "Hide"; });
  root.querySelectorAll("[data-reveal]").forEach(b=>b.dataset.l=b.textContent);
  root.querySelectorAll(".ticks button").forEach(b=>b.onclick=()=>b.setAttribute("aria-pressed", b.getAttribute("aria-pressed")!=="true"));
  root.querySelectorAll("[data-flip]").forEach(b=>b.onclick=()=>{
    const open = b.querySelector(".verdict").hidden;
    b.querySelectorAll(".verdict,.back").forEach(x=>x.hidden=!open);
    b.classList.toggle(b.dataset.good==="1" ? "is-good" : "is-bad", open);
  });
  root.querySelectorAll("[data-typefield]").forEach(b=>b.onclick=()=>{ const t=b.querySelector("[data-t]"); t.innerHTML = t.innerHTML ? "" : T(t.dataset.t); });
  root.querySelectorAll("[data-score]").forEach(box=>counters(box,["Team A","Team B"]));
  root.querySelectorAll("[data-votes]").forEach(box=>counters(box,["Votes FOR","Votes AGAINST"]));
  const sort = root.querySelector("[data-sort]");
  if (sort){
    const res = root.querySelector("[data-result]");
    sort.querySelectorAll(".sc").forEach(c=>c.onclick=()=>{
      const p=c.querySelector(".pick"), cur=SORT_TYPES.indexOf(c.dataset.pick), nx=SORT_TYPES[(cur+1)%SORT_TYPES.length];
      c.dataset.pick=nx; p.innerHTML=T(nx); c.classList.remove("right","wrong"); c.querySelector(".fix")?.remove(); res.textContent="";
    });
    root.querySelector("[data-check]").onclick=()=>{
      let ok=0; sort.querySelectorAll(".sc").forEach(c=>{
        c.querySelector(".fix")?.remove();
        const r = c.dataset.pick===c.dataset.ans; ok+=r; c.classList.toggle("right",r); c.classList.toggle("wrong",!r);
        if(!r){ const f=document.createElement("span"); f.className="fix"; f.textContent="→ "+c.dataset.ans; c.append(f); }
      });
      res.textContent = ok + " of 16 correct";
    };
    root.querySelector("[data-clear]").onclick=()=>{ sort.querySelectorAll(".sc").forEach(c=>{delete c.dataset.pick;c.querySelector(".pick").innerHTML="";c.classList.remove("right","wrong");c.querySelector(".fix")?.remove();}); res.textContent=""; };
  }
}
function counters(box,names){
  box.innerHTML = names.map(n=>`<div class="team"><b>${n}</b><button type="button" aria-label="${n} minus one">−</button><span class="n">0</span><button type="button" aria-label="${n} plus one">+</button></div>`).join("");
  box.querySelectorAll(".team").forEach(t=>{ const [m,p]=t.querySelectorAll("button"), n=t.querySelector(".n");
    m.onclick=()=>n.textContent=Math.max(0,+n.textContent-1); p.onclick=()=>n.textContent=+n.textContent+1; });
}

/* ---------- timer ---------- */
function stageSecs(i){ return L().stages[i].min * 60; }
function tick(force){
  const now = performance.now();
  if (running && last){ const d=(now-last)/1000; elapsed[period][idx]=(elapsed[period][idx]||0)+d; }
  last = running ? now : 0;
  const st = L().stages, used = st.reduce((a,_,i)=>a+(elapsed[period][i]||0),0);
  const left = stageSecs(idx) - (elapsed[period][idx]||0);
  $("stageNum").textContent = left >= 0 ? fmt(left) : fmt(left);
  $("stageLab").textContent = left >= 0 ? L().stages[idx].label + " · left" : "Time's up · over by";
  $("stageClock").classList.toggle("over", left < 0);
  $("lessonNum").textContent = fmt(Math.max(0, TOTAL - used));
  const planEnd = st.slice(0, idx+1).reduce((a,s)=>a+s.min*60,0);
  const behind = used - planEnd + Math.max(0,left);
  $("pace").textContent = !used ? "Ready" : (Math.abs(behind) < 30 ? "On pace" : behind > 0 ? fmt(behind).replace("+","") + " behind plan" : fmt(-behind).replace("+","") + " ahead");
  // strip
  $("strip").querySelectorAll("button").forEach((b,i)=>{
    const pct = Math.min(100,(elapsed[period][i]||0)/stageSecs(i)*100);
    b.querySelector(".fill").style.width = pct + "%";
    if (i===idx) b.setAttribute("aria-current","step"); else b.removeAttribute("aria-current");
  });
  // phases
  const s = st[idx];
  if (s.phases){
    let t = elapsed[period][idx]||0, acc = 0;
    document.querySelectorAll(".phase").forEach((p,i)=>{ const len=s.phases[i][1]*60;
      p.classList.toggle("past", t >= acc+len && i < s.phases.length-1); p.classList.toggle("now", t>=acc && (t<acc+len || i===s.phases.length-1)); acc+=len; });
  }
  if (left < 0 && !alerted[period][idx]){ alerted[period][idx]=true; timeUp(); }
}
function timeUp(){
  const nx = L().stages[idx+1];
  toast(nx ? `Time's up! Next: ${nx.label}` : "Time's up! Lesson complete.");
  if (soundOn && audio){ try{ [0,0.25,0.5].forEach((d,i)=>{ const o=audio.createOscillator(), g=audio.createGain(); o.frequency.value=[660,880,990][i]; g.gain.setValueAtTime(0.0001,audio.currentTime+d); g.gain.exponentialRampToValueAtTime(0.3,audio.currentTime+d+0.02); g.gain.exponentialRampToValueAtTime(0.0001,audio.currentTime+d+0.22); o.connect(g).connect(audio.destination); o.start(audio.currentTime+d); o.stop(audio.currentTime+d+0.25); }); }catch(e){} }
}
let toastT;
function toast(msg){ const t=$("toast"); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,4000); }
setInterval(()=>{ if (running) tick(); }, 250);

function setRunning(r){
  running = r; last = r ? performance.now() : 0;
  const b=$("play"); b.textContent = r ? "❚❚ Pause" : "▶ Start"; b.classList.toggle("running", r); b.setAttribute("aria-label", r ? "Pause timer" : "Start timer");
  if (r && navigator.wakeLock && !wake) navigator.wakeLock.request("screen").then(w=>{wake=w; w.addEventListener("release",()=>wake=null);}).catch(()=>{});
  tick(true);
}
function go(i){
  if (i<0 || i>=L().stages.length || i===idx) return;
  tick(); const dir = i>idx ? 1 : -1; idx=i; last = running ? performance.now() : 0; renderSlide(dir);
}
function setPeriod(p){
  tick(); period=p; idx=0; store.set("br7.period",p);
  $("pP1").setAttribute("aria-pressed",p==="p1"); $("pP2").setAttribute("aria-pressed",p==="p2");
  renderStrip(); renderSlide(0);
}

/* ---------- controls ---------- */
$("play").onclick=()=>setRunning(!running);
$("next").onclick=()=>go(idx+1);
$("prev").onclick=()=>go(idx-1);
$("strip").onclick=e=>{ const b=e.target.closest("[data-go]"); if(b) go(+b.dataset.go); };
document.querySelectorAll("[data-period]").forEach(b=>b.onclick=()=>setPeriod(b.dataset.period));
$("plus").onclick=()=>{ tick(); elapsed[period][idx]=(elapsed[period][idx]||0)-60; alerted[period][idx]=false; tick(true); toast("+1 minute for "+L().stages[idx].label); };
$("resetStage").onclick=()=>{ elapsed[period][idx]=0; alerted[period][idx]=false; last=running?performance.now():0; tick(true); };
let armed=false, armT;
$("resetAll").onclick=()=>{
  const b=$("resetAll");
  if(!armed){ armed=true; b.textContent="Tap again to reset"; armT=setTimeout(()=>{armed=false;b.textContent="New class";},3000); return; }
  clearTimeout(armT); armed=false; b.textContent="New class";
  setRunning(false); elapsed[period]=[]; alerted[period]=[]; idx=0; renderSlide(-1); toast("Timer reset for a new class");
};
cls.onchange=()=>{ store.set("br7.class",cls.value); renderSlide(0); };
function toggleNotes(){ const n=$("notes"); n.hidden=!n.hidden; $("notesBtn").setAttribute("aria-pressed",!n.hidden); }
$("notesBtn").onclick=toggleNotes;
$("notes").onclick=e=>{ if(e.target.closest("[data-closenotes]")) toggleNotes(); };
$("soundBtn").onclick=()=>{
  soundOn=!soundOn; $("soundBtn").setAttribute("aria-pressed",soundOn); $("soundBtn").textContent = soundOn ? "Chime on" : "Chime off";
  if (soundOn && !audio){ try{ audio = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ soundOn=false; } }
  audio?.resume?.();
};
function fullscreen(){ const d=document; if(d.fullscreenElement) d.exitFullscreen?.().catch(()=>{}); else d.documentElement.requestFullscreen?.().catch(()=>toast("Full screen is not available here. Try your browser's F11.")); }
$("fsBtn").onclick=fullscreen;
document.addEventListener("keydown",e=>{
  if (e.target.matches("select,input,textarea")) return;
  if (e.key==="ArrowRight"||e.key==="PageDown"){ e.preventDefault(); go(idx+1); }
  else if (e.key==="ArrowLeft"||e.key==="PageUp"){ e.preventDefault(); go(idx-1); }
  else if (e.key===" "&&!e.target.closest("button")){ e.preventDefault(); setRunning(!running); }
  else if (e.key==="n"||e.key==="N") toggleNotes();
  else if (e.key==="f"||e.key==="F") fullscreen();
});

setPeriod(period);
</script>
</body>
