<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>10BR Live Lessons</title>
<meta name="description" content="Timed 40-minute interactive lesson screens for Grade 10BR, IGCSE 0478 Topic 8 Programming, Weeks 7 to 15.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: projector console. Timer bar on top, coloured stage strip, one big stage screen, controls at the bottom.
   One deliberate light look (projectors wash out dark slides); each lesson stage owns a colour. */
:root{
  color-scheme:light;
  --paper:#f6f7fc; --card:#ffffff; --ink:#1b1d3a; --muted:#565b7c; --line:#d9dcec;
  --alert:#d8322a; --good:#11845f; --bad:#c2352b; --amber:#c98a00;
  --codebg:#1f2245; --codefg:#f1f0ff;
  --c:#8fd3ff; --cd:#0b6aa8;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-code:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --base:clamp(15px,0.9vw + 8px,25px);
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:var(--base);line-height:1.45;margin:0}
*{box-sizing:border-box}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--cd);outline-offset:2px}

.app{height:100%;display:grid;grid-template-rows:auto auto 1fr auto;padding-inline:16px;gap:10px;padding-block:10px}

/* ---- top bar ---- */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;justify-content:space-between}
.brand{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;min-width:0}
.brand b{font-family:var(--f-display);font-weight:800;font-size:1.1em;letter-spacing:-.01em}
.brand .sub{color:var(--muted);font-size:.8em}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:999px;overflow:hidden;max-width:100%}
.seg button{border:0;background:transparent;padding:.2em .8em;font-weight:700;font-size:.8em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:14em}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
select{border:2px solid var(--ink);border-radius:999px;background:var(--card);padding:.15em .6em;font-weight:700;font-size:.8em;max-width:100%}
.clocks{display:flex;align-items:stretch;gap:10px;flex-wrap:wrap}
.clock{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:.25em .8em;display:flex;flex-direction:column;justify-content:center;min-width:0}
.clock .lab{font-size:.62em;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.clock .num{font-family:var(--f-code);font-weight:700;font-variant-numeric:tabular-nums;line-height:1.05}
.clock.stage{border-color:var(--cd);background:var(--c)}
.clock.stage .lab{color:var(--ink)}
.clock.stage .num{font-size:2.6em}
.clock.lesson .num{font-size:1.6em}
.clock .pace{font-size:.66em;font-weight:700;color:var(--muted)}
.clock.over{background:var(--alert);border-color:var(--alert);color:#fff;animation:pulse 1s ease-in-out infinite}
.clock.over .lab{color:#fff}
@keyframes pulse{50%{transform:scale(1.04)}}
.play{border:0;border-radius:14px;background:var(--ink);color:var(--paper);font-weight:800;padding:0 1.1em;font-size:1em;min-height:2.6em}
.play.running{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}

/* ---- stage strip ---- */
.strip{display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin}
.strip button{position:relative;flex:var(--grow) 1 0;min-width:4.5em;border:2px solid transparent;border-radius:10px;background:color-mix(in srgb,var(--sc) 35%,var(--card));padding:.3em .5em;text-align:left;overflow:hidden;font-size:.7em;line-height:1.2}
.strip button .t{font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative}
.strip button .m{color:var(--muted);position:relative;font-variant-numeric:tabular-nums}
.strip button .fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--sc);transition:width .4s linear}
.strip button[aria-current="step"]{border-color:var(--ink)}

/* ---- stage screen ---- */
.screen{position:relative;min-height:0;overflow:hidden;border-radius:22px;background:var(--card);border:2px solid var(--line)}
.slide{position:absolute;inset:0;overflow:auto;display:flex;flex-direction:column}
.slide.in-next{animation:inNext .45s cubic-bezier(.2,.8,.2,1)}
.slide.in-prev{animation:inPrev .45s cubic-bezier(.2,.8,.2,1)}
@keyframes inNext{from{transform:translateX(6%);opacity:.2}}
@keyframes inPrev{from{transform:translateX(-6%);opacity:.2}}
.band{background:var(--c);padding:clamp(14px,2vw,30px) clamp(16px,3vw,44px);display:flex;flex-wrap:wrap;gap:8px 24px;align-items:flex-end;justify-content:space-between}
.band .eyebrow{font-size:.72em;text-transform:uppercase;letter-spacing:.1em;font-weight:700}
.band h2{font-family:var(--f-display);font-weight:800;font-size:clamp(1.7em,3.4vw,3.1em);line-height:1.02;margin:.1em 0 0;letter-spacing:-.02em;text-wrap:balance}
.band .who{font-size:.8em;font-weight:700;background:var(--card);border-radius:999px;padding:.25em .8em}
.body{padding:clamp(14px,2vw,30px) clamp(16px,3vw,44px);display:grid;gap:clamp(14px,1.6vw,26px);align-content:start;flex:1}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,17em),1fr));gap:clamp(14px,1.6vw,26px);align-items:start}
.cols>*{min-width:0}
.lead{font-size:1.2em;max-width:44em;margin:0;text-wrap:pretty}
h3{font-family:var(--f-display);font-weight:800;font-size:1.15em;margin:0 0 .35em;color:var(--cd)}
ul.plain{margin:0;padding-left:1.1em;display:grid;gap:.3em}
p{margin:0}
.panel{border:2px solid var(--line);border-radius:16px;padding:.8em 1em;min-width:0}
.panel.tint{background:color-mix(in srgb,var(--c) 22%,var(--card));border-color:color-mix(in srgb,var(--c) 60%,var(--card))}
.stack{display:grid;gap:.6em;align-content:start}

pre.code{font-family:var(--f-code);font-size:1em;background:var(--codebg);color:var(--codefg);border-radius:14px;padding:.8em 1em;margin:0;overflow-x:auto;line-height:1.5}
pre.code .k{color:#ffcf6b}
pre.code .s{color:#8fe8c9}
pre.code .c{color:#a6a9d6;font-style:italic}
.codehead{font-size:.7em;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:.3em}
code{font-family:var(--f-code);font-size:.92em;background:color-mix(in srgb,var(--c) 30%,var(--card));padding:0 .25em;border-radius:5px}

/* phases */
.phases{display:flex;gap:6px;flex-wrap:wrap}
.phase{border:2px solid var(--cd);border-radius:999px;padding:.25em .9em;font-weight:700;font-size:.85em;color:var(--cd);background:var(--card);font-variant-numeric:tabular-nums}
.phase.now{background:var(--cd);color:#fff}
.phase.past{opacity:.45;text-decoration:line-through}

/* reveal */
.reveal{border:2px dashed var(--cd);background:transparent;border-radius:12px;padding:.3em .9em;font-weight:700;color:var(--cd)}
.ans{background:color-mix(in srgb,var(--c) 30%,var(--card));border-radius:12px;padding:.5em .8em;font-weight:700}
.q{display:grid;gap:.45em;justify-items:start;min-width:0}
.q>*{max-width:100%;min-width:0}
.ans{overflow-x:auto}

/* key words */
.terms{display:flex;flex-wrap:wrap;gap:8px}
.term{border-radius:12px;background:color-mix(in srgb,var(--c) 28%,var(--card));padding:.35em .8em;display:flex;flex-direction:column}
.term span{font-size:.78em;color:var(--muted)}

/* tick lists */
.ticks{list-style:none;margin:0;padding:0;display:grid;gap:.4em}
.ticks button{display:flex;gap:.6em;align-items:flex-start;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:.45em .7em;width:100%}
.ticks button::before{content:"";flex:0 0 1.1em;height:1.1em;border:2px solid var(--cd);border-radius:6px;margin-top:.15em}
.ticks button[aria-pressed="true"]{border-color:var(--cd);background:color-mix(in srgb,var(--c) 25%,var(--card))}
.ticks button[aria-pressed="true"]::before{background:var(--cd);box-shadow:inset 0 0 0 3px var(--card)}

/* flip cards */
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,var(--cw,10.5em)),1fr));gap:10px}
.qcard{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:.6em .7em;text-align:left;display:flex;flex-direction:column;gap:.25em;min-height:4.6em;min-width:0}
.qcard .face{font-weight:700;font-size:1.02em;overflow-wrap:anywhere}
.qcard .face.mono{font-family:var(--f-code);font-size:.95em;white-space:pre-wrap}
.qcard .back{font-size:.82em}
.qcard.is-good{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--card))}
.qcard.is-bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--card))}
.qcard .verdict{font-weight:800;text-transform:uppercase;font-size:.75em;letter-spacing:.06em}
.is-good .verdict{color:var(--good)}
.is-bad .verdict{color:var(--bad)}

/* sorter */
.tag{display:inline-block;border-radius:999px;padding:.12em .7em;font-family:var(--f-code);font-weight:700;font-size:.8em;color:#fff}
.g0{background:#2958c9}.g1{background:#0e8a6a}.g2{background:#b4560a}.g3{background:#8b2fb8}.g4{background:#c22d5d}.g5{background:#3d6b00}
.sort{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,var(--cw,10em)),1fr));gap:8px}
.sc{border:2px solid var(--line);border-radius:12px;background:var(--card);padding:.4em .6em;text-align:left;display:flex;flex-direction:column;gap:.2em;min-width:0}
.sc b{overflow-wrap:anywhere}
.sc .ex{font-size:.75em;color:var(--muted);font-family:var(--f-code);overflow-wrap:anywhere}
.sc .pick{align-self:flex-start}
.sc .pick:empty::before{content:"tap to choose";font-size:.75em;color:var(--muted)}
.sc.right{border-color:var(--good);box-shadow:inset 0 0 0 2px var(--good)}
.sc.wrong{border-color:var(--bad);box-shadow:inset 0 0 0 2px var(--bad)}
.sc .fix{font-size:.72em;font-weight:700;color:var(--bad)}

/* parsons */
.parsons{list-style:none;margin:0;padding:0;display:grid;gap:6px;counter-reset:ln}
.parsons button{width:100%;text-align:left;font-family:var(--f-code);font-size:.92em;border:2px solid var(--line);background:var(--card);border-radius:10px;padding:.35em .7em;display:flex;gap:.8em;white-space:pre;overflow-x:auto}
.parsons button::before{counter-increment:ln;content:counter(ln);color:var(--muted);min-width:1.2em}
.parsons button.sel{border-color:var(--cd);background:color-mix(in srgb,var(--c) 35%,var(--card))}
.parsons button.right{border-color:var(--good)}
.parsons button.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--card))}

/* tables */
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:24em}
th,td{border-bottom:2px solid var(--line);padding:.4em .6em;text-align:left;vertical-align:top}
th{font-size:.72em;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
td code{white-space:nowrap}
.trace td{font-family:var(--f-code);font-variant-numeric:tabular-nums}
.cell{border:2px dashed var(--cd);background:transparent;border-radius:8px;padding:.1em .6em;font-weight:700;color:var(--cd);min-width:2.2em;text-align:left}
.cell.open{border-style:solid;background:color-mix(in srgb,var(--c) 30%,var(--card));color:var(--ink)}

/* counters */
.score{display:flex;flex-wrap:wrap;gap:10px}
.team{display:flex;align-items:center;gap:.5em;border:2px solid var(--cd);border-radius:14px;padding:.3em .6em;background:var(--card)}
.team b{min-width:4.5em}
.team .n{font-family:var(--f-code);font-size:1.6em;font-weight:700;min-width:1.6em;text-align:center;font-variant-numeric:tabular-nums}
.team button{border:2px solid var(--ink);background:var(--card);border-radius:10px;width:1.9em;height:1.9em;font-weight:800;line-height:1}

.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:2px solid var(--ink);background:var(--card);border-radius:12px;padding:.3em .9em;font-weight:700}
.btn.solid{background:var(--ink);color:var(--paper)}
.note{font-size:.82em;color:var(--muted)}
.big{font-family:var(--f-display);font-weight:800;font-size:1.6em;line-height:1.1;text-wrap:balance;margin:0}
.ok{color:var(--good);font-weight:800}
.no{color:var(--bad);font-weight:800}

/* special widgets */
.phone{display:grid;grid-template-columns:repeat(3,minmax(0,3.2em));gap:8px}
.phone button{aspect-ratio:1;max-width:100%;border-radius:50%;border:2px solid var(--ink);background:var(--card);font-weight:800;font-size:1.2em}
.screenout{font-family:var(--f-code);background:var(--codebg);color:#8fe8c9;border-radius:12px;padding:.6em .9em;min-height:2.6em}
.stars{font-family:var(--f-code);font-size:1.3em;line-height:1.2;color:var(--cd);white-space:pre;overflow-x:auto;margin:0}
.num-in{width:4em;border:2px solid var(--ink);border-radius:10px;padding:.15em .4em;font-weight:700;background:var(--card)}
.dice{font-family:var(--f-display);font-size:3.4em;font-weight:800;width:1.6em;height:1.6em;display:grid;place-items:center;border:3px solid var(--ink);border-radius:18px;background:var(--card)}
.bars{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;align-items:end;height:6em}
.bars div{background:var(--cd);border-radius:6px 6px 0 0;min-height:2px;position:relative}
.bars span{position:absolute;top:-1.3em;left:0;right:0;text-align:center;font-size:.7em;font-weight:700;color:var(--ink)}
.barlab{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;text-align:center;font-size:.75em;font-weight:700}
.ruler{display:flex;gap:3px;flex-wrap:wrap}
.ruler div{display:grid;grid-template-rows:auto auto auto;text-align:center;min-width:2.1em}
.ruler .ch{font-family:var(--f-code);font-weight:700;font-size:1.3em;border:2px solid var(--ink);border-radius:8px;background:var(--card);padding:.1em 0}
.ruler .i1{font-size:.7em;color:var(--cd);font-weight:700}
.ruler .i0{font-size:.7em;color:var(--bad);font-weight:700}
.rag{display:flex;flex-wrap:wrap;gap:8px}
.rag button{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:.3em .9em;font-weight:700}
.rag button[data-s="1"]{background:#ffd9d4;border-color:var(--bad)}
.rag button[data-s="2"]{background:#ffeab0;border-color:var(--amber)}
.rag button[data-s="3"]{background:#cdeedd;border-color:var(--good)}
.flow{display:grid;justify-items:center;gap:6px;font-weight:700;text-align:center}
.flow .box{border:2px solid var(--ink);border-radius:10px;padding:.3em .9em;background:var(--card)}
.flow .dia{border:2px solid var(--cd);background:color-mix(in srgb,var(--c) 30%,var(--card));padding:.6em 1.2em;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);min-width:12em}
.flow .split{display:flex;gap:2em;flex-wrap:wrap;justify-content:center}
.flow .arrow{color:var(--muted)}
.scope{border:3px solid var(--cd);border-radius:16px;padding:.6em .8em;display:grid;gap:.5em;background:color-mix(in srgb,var(--c) 15%,var(--card))}
.scope .inner{border:3px dashed var(--bad);border-radius:12px;padding:.5em .7em;background:var(--card)}
.scope .lbl{font-size:.7em;font-weight:800;text-transform:uppercase;letter-spacing:.08em}

/* ---- bottom controls ---- */
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.controls .grp{display:flex;flex-wrap:wrap;gap:8px}
.nav{border:0;background:var(--ink);color:var(--paper);border-radius:12px;padding:.4em 1.1em;font-weight:800}
.nav:disabled{opacity:.3;cursor:default}
.ghost{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:.3em .8em;font-weight:700;font-size:.8em}
.ghost[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.ghost.tool{border-color:var(--cd);color:var(--cd)}

/* ---- overlays ---- */
.notes{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(26em,calc(100vw - 20px));background:var(--ink);color:var(--paper);border-radius:18px;padding:1em 1.1em;overflow:auto;z-index:5;font-size:.8em;display:grid;gap:.8em;align-content:start;box-shadow:0 20px 50px rgba(20,22,60,.35)}
.notes h4{margin:0;font-family:var(--f-display);font-size:1.2em}
.notes .k{font-size:.72em;text-transform:uppercase;letter-spacing:.09em;opacity:.7;font-weight:700}
.notes .close,.pop .close{justify-self:end;border:2px solid currentColor;background:transparent;border-radius:10px;padding:.15em .7em;font-weight:700}
.pop{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:7;background:var(--card);border:3px solid var(--ink);border-radius:22px;padding:1em 1.3em;width:min(30em,calc(100vw - 32px));max-height:calc(100vh - 32px);overflow:auto;display:grid;gap:.8em;box-shadow:0 30px 80px rgba(20,22,60,.4)}
.pop h4{margin:0;font-family:var(--f-display);font-size:1.4em}
.picked{font-family:var(--f-display);font-weight:800;font-size:5em;line-height:1;text-align:center;color:var(--cd)}
.countdown{position:fixed;inset:0;z-index:8;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 85%,transparent);font-family:var(--f-display);font-weight:800;font-size:min(40vw,40vh);color:var(--ink);pointer-events:none}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--alert);color:#fff;font-weight:800;padding:.6em 1.2em;border-radius:14px;z-index:9;font-size:1.05em;max-width:calc(100vw - 32px);text-align:center}

@media (prefers-reduced-motion:reduce){.slide.in-next,.slide.in-prev,.clock.over{animation:none}.strip button .fill{transition:none}}
@media (max-width:700px){
  .app{height:auto;min-height:100%}
  .screen{min-height:70vh}
  .slide{position:relative;inset:auto}
}
</style>
</head>
<body>

<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <b>G10BR</b>
      <label class="sub" for="wk">Week</label>
      <select id="wk"></select>
      <div class="seg" role="group" aria-label="Lesson" id="perSeg">
        <button type="button" id="pP1" data-period="1">P1</button>
        <button type="button" id="pP2" data-period="2">P2</button>
      </div>
      <label class="sub" for="cls">Class</label>
      <select id="cls"><option>10BR1</option><option>10BR2</option><option>10BR3</option></select>
    </div>
    <div class="clocks">
      <div class="clock stage" id="stageClock"><span class="lab" id="stageLab">This part</span><span class="num" id="stageNum">0:00</span></div>
      <div class="clock lesson"><span class="lab">Lesson left</span><span class="num" id="lessonNum">40:00</span><span class="pace" id="pace">Ready</span></div>
      <button type="button" class="play" id="play" aria-label="Start timer">▶ Start</button>
    </div>
  </header>

  <nav class="strip" id="strip" aria-label="Lesson stages"></nav>

  <main class="screen" id="screen" aria-live="polite"></main>

  <footer class="controls">
    <div class="grp">
      <button type="button" class="nav" id="prev">◀ Back</button>
      <button type="button" class="nav" id="next">Next ▶</button>
      <button type="button" class="ghost tool" id="pickBtn">Pick a student</button>
      <button type="button" class="ghost tool" id="teamsBtn">Team scores</button>
      <button type="button" class="ghost tool" id="showBtn">Show me 3-2-1</button>
    </div>
    <div class="grp">
      <button type="button" class="ghost" id="plus">+1 min</button>
      <button type="button" class="ghost" id="resetStage">Restart part</button>
      <button type="button" class="ghost" id="notesBtn" aria-pressed="false">Teacher notes</button>
      <button type="button" class="ghost" id="soundBtn" aria-pressed="false">Chime off</button>
      <button type="button" class="ghost" id="fsBtn">Full screen</button>
      <button type="button" class="ghost" id="resetAll">New class</button>
    </div>
  </footer>
</div>

<aside class="notes" id="notes" hidden aria-label="Teacher notes"></aside>

<div class="pop" id="pickPop" hidden role="dialog" aria-label="Pick a student">
  <button type="button" class="close" data-close="pickPop">Close</button>
  <h4>Pick a student</h4>

const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const PCK = new Set("DECLARE CONSTANT INPUT OUTPUT IF THEN ELSE ENDIF CASE OF OTHERWISE ENDCASE FOR TO STEP NEXT WHILE DO ENDWHILE REPEAT UNTIL PROCEDURE ENDPROCEDURE FUNCTION RETURNS RETURN ENDFUNCTION CALL AND OR NOT MOD DIV INTEGER REAL CHAR STRING BOOLEAN TRUE FALSE LENGTH SUBSTRING UCASE LCASE ROUND RANDOM".split(" "));
const PYK = new Set("print input int float str if elif else for in range while True False None break def return match case and or not len global import from round random randint lower upper".split(" "));
function hl(src, lang){
  const K = lang === "py" ? PYK : PCK, cm = lang === "py" ? "#" : "//";
  return src.split("\n").map(line => {
    let out = "", i = 0, m; const re = /("[^"]*"|'[^']*'|#.*$|\/\/.*$|[A-Za-z_]\w*)/g;
    while ((m = re.exec(line))){
      out += esc(line.slice(i, m.index)); const t = m[0];
      if (t[0] === '"' || t[0] === "'") out += `<span class="s">${esc(t)}</span>`;
      else if (t.startsWith(cm)) out += `<span class="c">${esc(t)}</span>`;
      else if (K.has(t)) out += `<span class="k">${t}</span>`;
      else out += esc(t);
      i = m.index + t.length;
    }
    return out + esc(line.slice(i));
  }).join("\n");
}

/* ---- widgets ---- */
function wire(root){
  root.querySelectorAll("[data-reveal]").forEach(b => { b.dataset.l = b.textContent; b.onclick = () => { const a = b.nextElementSibling; a.hidden = !a.hidden; b.textContent = a.hidden ? b.dataset.l : "Hide"; }; });
  root.querySelectorAll(".ticks button").forEach(b => b.onclick = () => b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") !== "true"));
  root.querySelectorAll("[data-flip]").forEach(b => b.onclick = () => {
    const open = b.querySelector(".verdict").hidden;
    b.querySelectorAll(".verdict,.back").forEach(x => x.hidden = !open);
    b.classList.toggle(b.dataset.good === "1" ? "is-good" : "is-bad", open);
  });
  root.querySelectorAll("[data-cell]").forEach(b => b.onclick = () => { const [q,v] = b.children; q.hidden = !q.hidden; v.hidden = !v.hidden; b.classList.toggle("open", !v.hidden); });
  root.querySelectorAll("[data-showme]").forEach(b => b.onclick = showMe);
  root.querySelectorAll("[data-counters]").forEach(box => wireCounters(box, box.dataset.counters.split("|")));
  root.querySelectorAll("[data-sorter]").forEach(wireSorter);
  root.querySelectorAll("[data-parsons]").forEach(wireParsons);
  root.querySelectorAll("[data-trace]").forEach(wireTrace);
  root.querySelectorAll("[data-menu]").forEach(wireMenu);
  root.querySelectorAll("[data-stars]").forEach(wireStars);
  root.querySelectorAll("[data-dice]").forEach(wireDice);
  root.querySelectorAll("[data-rag] button").forEach(b => b.onclick = () => b.dataset.s = (+b.dataset.s + 1) % 4);
}
function wireCounters(box, names){
  box.innerHTML = names.map(n => `<div class="team"><b>${esc(n)}</b><button type="button" aria-label="${esc(n)} minus one">−</button><span class="n">0</span><button type="button" aria-label="${esc(n)} plus one">+</button></div>`).join("");
  box.querySelectorAll(".team").forEach(t => { const [m,p] = t.querySelectorAll("button"), n = t.querySelector(".n");
    m.onclick = () => n.textContent = Math.max(0, +n.textContent - 1); p.onclick = () => n.textContent = +n.textContent + 1; });
}
function wireSorter(box){
  const cats = box.dataset.sorter.split("|"), res = box.querySelector("[data-result]"), cards = box.querySelectorAll(".sc");
  const tag = i => `<span class="tag g${i}">${esc(cats[i])}</span>`;
  cards.forEach(c => c.onclick = () => {
    const nx = c.dataset.pick === undefined ? 0 : (+c.dataset.pick + 1) % cats.length;
    c.dataset.pick = nx; c.querySelector(".pick").innerHTML = tag(nx); c.classList.remove("right","wrong"); c.querySelector(".fix")?.remove(); res.textContent = "";
  });
  box.querySelector("[data-check]").onclick = () => {
    let ok = 0; cards.forEach(c => { c.querySelector(".fix")?.remove();
      const r = c.dataset.pick === c.dataset.ans; ok += r; c.classList.toggle("right", r); c.classList.toggle("wrong", !r);
      if (!r){ const f = document.createElement("span"); f.className = "fix"; f.textContent = "→ " + cats[+c.dataset.ans]; c.append(f); } });
    res.textContent = `${ok} of ${cards.length} correct`;
  };
  box.querySelector("[data-clear]").onclick = () => { cards.forEach(c => { delete c.dataset.pick; c.querySelector(".pick").innerHTML = ""; c.classList.remove("right","wrong"); c.querySelector(".fix")?.remove(); }); res.textContent = ""; };
}
function wireParsons(box){
  const ol = box.querySelector(".parsons"), res = box.querySelector("[data-presult]");
  const items = () => [...ol.querySelectorAll("button")];
  const shuffle = () => {
    const lis = [...ol.children]; let order;
    do { order = lis.map(l => [Math.random(), l]).sort((a,b) => a[0]-b[0]).map(x => x[1]); } while (lis.length > 1 && order.every((l,i) => l === lis[i]));
    ol.replaceChildren(...order); items().forEach(b => b.classList.remove("right","wrong","sel")); res.textContent = "";
  };
  shuffle();
  let sel = null;
  ol.onclick = e => {
    const b = e.target.closest("button"); if (!b) return;
    items().forEach(x => x.classList.remove("right","wrong")); res.textContent = "";
    if (!sel){ sel = b; b.classList.add("sel"); return; }
    if (sel !== b){ const a = sel.parentNode, c = b.parentNode, tmp = document.createElement("li"); ol.replaceChild(tmp, a); ol.replaceChild(a, c); ol.replaceChild(c, tmp); }
    sel.classList.remove("sel"); sel = null;
  };
  box.querySelector("[data-pcheck]").onclick = () => {
    let ok = 0; items().forEach((b,i) => { const r = +b.dataset.i === i; ok += r; b.classList.toggle("right", r); b.classList.toggle("wrong", !r); });
    res.textContent = ok === items().length ? "All in order!" : `${ok} of ${items().length} in the right place`;
  };
  box.querySelector("[data-psolve]").onclick = () => { const lis = [...ol.children].sort((a,b) => a.firstChild.dataset.i - b.firstChild.dataset.i); ol.replaceChildren(...lis); items().forEach(b => { b.classList.remove("wrong","sel"); b.classList.add("right"); }); sel = null; res.textContent = "Solution shown"; };
  box.querySelector("[data-pshuffle]").onclick = () => { sel = null; shuffle(); };
}
function wireTrace(box){
  const rows = [...box.querySelectorAll("tbody tr")];
  box.querySelector("[data-tnext]").onclick = () => { const r = rows.find(r => r.hidden); if (r) r.hidden = false; };
  box.querySelector("[data-tall]").onclick = () => rows.forEach(r => r.hidden = false);
  box.querySelector("[data-thide]").onclick = () => rows.forEach(r => r.hidden = true);
}
function wireMenu(pad){
  const map = JSON.parse(pad.dataset.menu), out = pad.closest(".cols").querySelector("[data-menuout]");
  pad.querySelectorAll("button").forEach(b => b.onclick = () => { const k = b.dataset.key; out.textContent = `Pressed ${k} → ${map[k] || map["*"]}`; });
}
function wireStars(box){
  const out = box.closest(".cols").querySelector("[data-starsout]"), r = box.querySelector("[data-rows]"), c = box.querySelector("[data-cols]"), t = box.querySelector("[data-tri]"), cnt = box.querySelector("[data-count]");
  const draw = () => {
    const R = Math.max(1, Math.min(10, +r.value || 1)), C = Math.max(1, Math.min(20, +c.value || 1));
    let lines = [], n = 0;
    for (let i = 1; i <= R; i++){ const w = t.checked ? i : C; lines.push("*".repeat(w)); n += w; }
    out.textContent = lines.join("\n");
    cnt.innerHTML = `Inner loop ran <b>${n}</b> times in total.`;
  };
  [r,c,t].forEach(x => x.oninput = draw); draw();
}
function wireDice(box){
  const face = box.querySelector("[data-face]"), bars = box.querySelector("[data-bars]"), tot = box.querySelector("[data-total]");
  let counts = [0,0,0,0,0,0];
  const draw = () => { const n = counts.reduce((a,b) => a+b, 0), mx = Math.max(1, ...counts);
    bars.innerHTML = counts.map(v => `<div style="height:${v/mx*100}%"><span>${v}</span></div>`).join(""); tot.textContent = `${n} rolls`; };
  box.querySelectorAll("[data-roll]").forEach(b => b.onclick = () => {
    const k = +b.dataset.roll; if (!k){ counts = [0,0,0,0,0,0]; face.textContent = "?"; return draw(); }
    let v; for (let i = 0; i < k; i++){ v = 1 + Math.floor(Math.random()*6); counts[v-1]++; }
    face.textContent = v; draw();
  });
  draw();
}

/* ---- timer ---- */
const stageSecs = i => lesson().stages[i].min * 60;
function tick(){
  const now = performance.now(), E = el();
  if (running && last) E[idx] = (E[idx] || 0) + (now - last)/1000;
  last = running ? now : 0;
  const st = lesson().stages, used = st.reduce((a,_,i) => a + (E[i] || 0), 0), left = stageSecs(idx) - (E[idx] || 0);
  $("stageNum").textContent = fmt(left);
  $("stageLab").textContent = left >= 0 ? st[idx].label + " · left" : "Time's up · over by";
  $("stageClock").classList.toggle("over", left < 0);
  $("lessonNum").textContent = fmt(Math.max(0, TOTAL - used));
  const planEnd = st.slice(0, idx+1).reduce((a,s) => a + s.min*60, 0), behind = used - planEnd + Math.max(0, left);
  $("pace").textContent = !used ? "Ready" : (Math.abs(behind) < 30 ? "On pace" : behind > 0 ? fmt(behind) .replace("+","") + " behind plan" : fmt(-behind).replace("+","") + " ahead");
  $("strip").querySelectorAll("button").forEach((b,i) => {
    b.querySelector(".fill").style.width = Math.min(100, (E[i] || 0)/stageSecs(i)*100) + "%";
    if (i === idx) b.setAttribute("aria-current","step"); else b.removeAttribute("aria-current");
  });
  const s = st[idx];
  if (s.phases){ const t = E[idx] || 0; let acc = 0;
    document.querySelectorAll(".phase").forEach((p,i) => { const len = s.phases[i][1]*60, lastP = i === s.phases.length-1;
      p.classList.toggle("past", t >= acc + len && !lastP); p.classList.toggle("now", t >= acc && (t < acc + len || lastP)); acc += len; }); }
  if (left < 0 && !al()[idx]){ al()[idx] = true; timeUp(); }
}
function chime(){ if (!soundOn || !audio) return; try{ [0,.25,.5].forEach((d,i) => { const o = audio.createOscillator(), g = audio.createGain(); o.frequency.value = [660,880,990][i];
  g.gain.setValueAtTime(.0001, audio.currentTime+d); g.gain.exponentialRampToValueAtTime(.3, audio.currentTime+d+.02); g.gain.exponentialRampToValueAtTime(.0001, audio.currentTime+d+.22);
  o.connect(g).connect(audio.destination); o.start(audio.currentTime+d); o.stop(audio.currentTime+d+.25); }); }catch(e){} }
function timeUp(){ const nx = lesson().stages[idx+1]; toast(nx ? `Time's up! Next: ${nx.label}` : "Time's up! Lesson complete."); chime(); }
let toastT;
function toast(msg){ const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 4000); }
setInterval(() => { if (running) tick(); }, 250);

function setRunning(r){
  tick(); running = r; last = r ? performance.now() : 0;
  const b = $("play"); b.textContent = r ? "❚❚ Pause" : "▶ Start"; b.classList.toggle("running", r); b.setAttribute("aria-label", r ? "Pause timer" : "Start timer");
  if (r && navigator.wakeLock && !wake) navigator.wakeLock.request("screen").then(w => { wake = w; w.addEventListener("release", () => wake = null); }).catch(() => {});
}
function go(i){ if (i < 0 || i >= lesson().stages.length || i === idx) return; tick(); const d = i > idx ? 1 : -1; idx = i; renderSlide(d); }
function setLesson(k){
  if (running) setRunning(false);
  key = k; idx = 0;
  const [w,p] = k.split("-");
  $("wk").value = w;
  ["1","2"].forEach(n => { const b = $("pP"+n); b.setAttribute("aria-pressed", n === p); b.textContent = `P${n} · ${L[w+"-"+n].short}`; });
  try{ history.replaceState(null, "", "#w"+w+"p"+p); }catch(e){}
  renderStrip(); renderSlide(0); renderTeams();
}

/* ---- class tools ---- */
function showMe(){
  const o = $("countdown"); let n = 3; o.hidden = false; o.textContent = n;
  const t = setInterval(() => { n--; if (n > 0) o.textContent = n; else if (n === 0){ o.textContent = "Show!"; chime(); } else { clearInterval(t); o.hidden = true; } }, 900);
}
let pool = [];
function resetPool(){ const n = Math.max(2, Math.min(40, +$("pickN").value || 28)); pool = Array.from({length:n}, (_,i) => i+1); $("pickLeft").textContent = `${pool.length} left`; $("picked").textContent = "?"; }
$("pickGo").onclick = () => {
  if (!pool.length) resetPool();
  let spins = 0; const t = setInterval(() => { $("picked").textContent = pool[Math.floor(Math.random()*pool.length)]; if (++spins > 10){ clearInterval(t);
    const i = Math.floor(Math.random()*pool.length), v = pool.splice(i,1)[0]; $("picked").textContent = v; $("pickLeft").textContent = `${pool.length} left`; } }, 60);
};
$("pickReset").onclick = resetPool; $("pickN").onchange = resetPool; resetPool();
function renderTeams(){
  const s = (teamScores[key] ||= {A:0,B:0,C:0,D:0});
  $("teamsBox").innerHTML = Object.keys(s).map(t => `<div class="team"><b>Team ${t}</b><button type="button" data-t="${t}" data-d="-1" aria-label="Team ${t} minus one">−</button><span class="n">${s[t]}</span><button type="button" data-t="${t}" data-d="1" aria-label="Team ${t} plus one">+</button></div>`).join("");
}
$("teamsBox").onclick = e => { const b = e.target.closest("[data-t]"); if (!b) return; const s = teamScores[key]; s[b.dataset.t] = Math.max(0, s[b.dataset.t] + +b.dataset.d); renderTeams(); };
$("teamsReset").onclick = () => { teamScores[key] = {A:0,B:0,C:0,D:0}; renderTeams(); };
const togglePop = id => { const p = $(id); const open = p.hidden; document.querySelectorAll(".pop").forEach(x => x.hidden = true); p.hidden = !open; };
$("pickBtn").onclick = () => togglePop("pickPop");
$("teamsBtn").onclick = () => togglePop("teamsPop");
$("showBtn").onclick = showMe;
document.querySelectorAll("[data-close]").forEach(b => b.onclick = () => $(b.dataset.close).hidden = true);

/* ---- controls ---- */
$("play").onclick = () => setRunning(!running);
$("next").onclick = () => go(idx+1);
$("prev").onclick = () => go(idx-1);
$("strip").onclick = e => { const b = e.target.closest("[data-go]"); if (b) go(+b.dataset.go); };
$("wk").onchange = () => setLesson($("wk").value + "-1");
document.querySelectorAll("[data-period]").forEach(b => b.onclick = () => setLesson($("wk").value + "-" + b.dataset.period));
$("plus").onclick = () => { tick(); el()[idx] = (el()[idx] || 0) - 60; al()[idx] = false; tick(); toast("+1 minute for " + lesson().stages[idx].label); };
$("resetStage").onclick = () => { el()[idx] = 0; al()[idx] = false; last = running ? performance.now() : 0; tick(); };
let armed = false, armT;
$("resetAll").onclick = () => {
  const b = $("resetAll");
  if (!armed){ armed = true; b.textContent = "Tap again to reset"; armT = setTimeout(() => { armed = false; b.textContent = "New class"; }, 3000); return; }
  clearTimeout(armT); armed = false; b.textContent = "New class";
  setRunning(false); elapsed[key] = []; alerted[key] = []; teamScores[key] = {A:0,B:0,C:0,D:0}; renderTeams(); idx = 0; renderSlide(-1); toast("Timer and scores reset for a new class");
};
cls.onchange = () => { store.set("br.class", cls.value); renderSlide(0); };
function toggleNotes(){ const n = $("notes"); n.hidden = !n.hidden; $("notesBtn").setAttribute("aria-pressed", !n.hidden); }
$("notesBtn").onclick = toggleNotes;
$("notes").onclick = e => { if (e.target.closest("[data-closenotes]")) toggleNotes(); };
$("soundBtn").onclick = () => {
  soundOn = !soundOn; $("soundBtn").setAttribute("aria-pressed", soundOn); $("soundBtn").textContent = soundOn ? "Chime on" : "Chime off";
  if (soundOn && !audio){ try{ audio = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ soundOn = false; } }
  audio?.resume?.();
};
function fullscreen(){ const d = document; if (d.fullscreenElement) d.exitFullscreen?.().catch(() => {}); else d.documentElement.requestFullscreen?.().catch(() => toast("Full screen is not available here. Try your browser's F11.")); }
$("fsBtn").onclick = fullscreen;
document.addEventListener("keydown", e => {
  if (e.target.matches("select,input,textarea")) return;
  if (e.key === "ArrowRight" || e.key === "PageDown"){ e.preventDefault(); go(idx+1); }
  else if (e.key === "ArrowLeft" || e.key === "PageUp"){ e.preventDefault(); go(idx-1); }
  else if (e.key === " " && !e.target.closest("button")){ e.preventDefault(); setRunning(!running); }
  else if (e.key === "n" || e.key === "N") toggleNotes();
  else if (e.key === "f" || e.key === "F") fullscreen();
  else if (e.key === "s" || e.key === "S") showMe();
  else if (e.key === "Escape"){ document.querySelectorAll(".pop").forEach(x => x.hidden = true); if (!$("notes").hidden) toggleNotes(); }
});

const m = /^#w(\d+)p([12])$/.exec(location.hash);
setLesson(m && L[m[1]+"-"+m[2]] ? m[1]+"-"+m[2] : weekFromDate()+"-1");
</script>
